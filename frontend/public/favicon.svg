<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241734"/>
      <stop offset="100%" stop-color="#0e0a19"/>
    </linearGradient>
    <linearGradient id="grad" x1="8" y1="12" x2="56" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gold" x1="16" y1="20" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Squircle container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#grad)" stroke-width="2.5"/>

  <!-- Graduation Cap Top (Mortarboard) -->
  <path d="M32 15 L53 25 L32 35 L11 25 Z" fill="url(#grad)"/>

  <!-- Cap Crown -->
  <path d="M20 30.5 V39.5 C20 44.5 44 44.5 44 39.5 V30.5" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden Tassel with Spark -->
  <path d="M48 27.5 V38 L46 41" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="42" r="2.2" fill="url(#gold)"/>

  <!-- Center magical star sparkle -->
  <path d="M32 20 Q32 25 37 25 Q32 25 32 30 Q32 25 27 25 Q32 25 32 20 Z" fill="#ffffff"/>
  <circle cx="32" cy="25" r="1.3" fill="url(#gold)"/>
</svg>